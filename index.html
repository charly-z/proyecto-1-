<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mini Examen de Verbos en Inglés</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f0fc;
      padding: 30px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    .pregunta {
      margin-bottom: 20px;
    }
    .boton {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }
    .boton:hover {
      background-color: #2980b9;
    }
    .resultado {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Mini Examen de Verbos en Inglés</h1>
  <div id="quiz"></div>
  <script>
    const frasesMotivadoras = [
      "¡Cada vez estás más cerca de conseguir lo que quieres!",
      "¡Wow! Eso estuvo genial.",
      "¡Eres una estrella del inglés!",
      "¡Sigue esforzándote y lograrás todo!",
      "¡Muy bien! Vas con todo.",
      "¡Perfecto! Sigue así."
    ];

    const preguntas = [
      { pregunta: "¿Cómo se dice 'correr' en inglés?", correcta: "Run", opciones: ["Rin", "Rak", "Run"] },
      { pregunta: "¿Cómo se dice 'saltar' en inglés?", correcta: "Jump", opciones: ["Slip", "Jump", "Shake"] },
      { pregunta: "¿Cómo se dice 'comer' en inglés?", correcta: "Eat", opciones: ["Come", "Eat", "Hit"] },
      { pregunta: "¿Cómo se dice 'dormir' en inglés?", correcta: "Sleep", opciones: ["Rest", "Sleep", "Sit"] },
      { pregunta: "¿Cómo se dice 'leer' en inglés?", correcta: "Read", opciones: ["Ride", "Read", "Red"] },
      { pregunta: "¿Cómo se dice 'volar' en inglés?", correcta: "Fly", opciones: ["Fly", "Float", "Throw"] }
    ];

    const quizDiv = document.getElementById("quiz");

    preguntas.forEach((item, index) => {
      const div = document.createElement("div");
      div.classList.add("pregunta");

      const p = document.createElement("p");
      p.innerHTML = `<strong>${index + 1}. ${item.pregunta}</strong>`;
      div.appendChild(p);

      const resultado = document.createElement("div");
      resultado.classList.add("resultado");
      resultado.id = "resultado" + index;

      item.opciones.forEach(opcion => {
        const btn = document.createElement("button");
        btn.classList.add("boton");
        btn.textContent = opcion;
        btn.onclick = () => {
          const r = document.getElementById("resultado" + index);
          if (opcion === item.correcta) {
            r.innerHTML = "¡Correcto! " + frasesMotivadoras[Math.floor(Math.random() * frasesMotivadoras.length)];
            r.style.color = "green";
          } else {
            r.innerHTML = "Incorrecto. La respuesta correcta es: " + item.correcta;
            r.style.color = "red";
          }
        };
        div.appendChild(btn);
      });

      div.appendChild(resultado);
      quizDiv.appendChild(div);
    });
  </script>
</body>
</html>
